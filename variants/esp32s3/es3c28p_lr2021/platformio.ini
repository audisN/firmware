; LCDWIKI ES3C28P (ESP32-S3R8, 2.8" ILI9341 IPS 320x240, FT6336G touch, microSD)
; + NiceRF LoRa2021F33-2G4 (LR2021, 868 MHz) - Meshtastic UI (device-ui) on the screen, phone over BLE or USB.
; https://www.lcdwiki.com/2.8inch_ESP32-S3_Display
[env:es3c28p_lr2021]
extends = esp32s3_base
board = es3c28p
board_level = extra
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
upload_protocol = esptool

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/es3c28p_lr2021>

build_flags = ${esp32s3_base.build_flags}
  -I variants/esp32s3/es3c28p_lr2021
  -D ES3C28P_LR2021
  -D CONFIG_ARDUHAL_ESP_LOG
  -D CONFIG_ARDUHAL_LOG_COLORS=1
  -D CONFIG_DISABLE_HAL_LOCKS=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -D MESHTASTIC_EXCLUDE_SCREEN=1
  -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -D MESHTASTIC_EXCLUDE_INPUTBROKER=1
  ; device-ui shows config.bluetooth.fixed_pin on its programming screen, but a TFT build defaults to
  ; RANDOM_PIN whose passkey the UI never shows. Fixed PIN so the screen and the phone agree.
  -D USERPREFS_FIXED_BLUETOOTH=123456
  ; keep the screen UI running while a phone is connected over BLE (src/mesh/api/PacketAPI.cpp)
  -D MUI_WITH_BLUETOOTH
  ; screen menu: TX power 0.5 W / 1 W and duty cycle 10 % / 100 % (variant.h TX_POWER_ABOVE_REGION_LIMIT)
  -D DEVICEUI_TX_OPTIONS
  ; microSD slot, SDIO in 1-bit mode
  -D HAS_SDCARD
  -D HAS_SD_MMC
  -D SD_SCLK_PIN=38
  -D SD_MOSI_PIN=40 ; CMD
  -D SD_MISO_PIN=39 ; D0
  -D SDCARD_CS=-1
  ; device-ui (MUI)
  -D HAS_SCREEN=0
  -D HAS_TFT=1
  -D RAM_SIZE=5120
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_GESTURE_RECOGNITION=1
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D LV_BUILD_TEST=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D VIEW_320x240
  -D USE_PACKET_API
  -D MAP_FULL_REDRAW
  ; display: ILI9341 on SPI3 (IO10 CS, IO11 MOSI, IO12 SCK, IO13 MISO, IO46 DC, IO45 backlight, reset = EN)
  -D LGFX_DRIVER_TEMPLATE
  -D LGFX_DRIVER=LGFX_GENERIC
  -D GFX_DRIVER_INC=\"graphics/LGFX/LGFX_GENERIC.h\"
  -D LGFX_BUFSIZE=153600
  -D SPI_FREQUENCY=40000000
  -D LGFX_PANEL=ILI9341
  -D LGFX_SCREEN_WIDTH=240
  -D LGFX_SCREEN_HEIGHT=320
  -D DISPLAY_SIZE=320x240 ; landscape
  -D LGFX_ROTATION=1
  -D LGFX_PIN_SCK=12
  -D LGFX_PIN_MOSI=11
  -D LGFX_PIN_MISO=13
  -D LGFX_PIN_DC=46
  -D LGFX_PIN_CS=10
  -D LGFX_PIN_RST=-1
  -D LGFX_PIN_BL=45
  ; touch: FT6336G (FT5x06 family) on the shared I2C bus
  -D LGFX_TOUCH=FT5x06
  -D LGFX_TOUCH_I2C_FREQ=400000
  -D LGFX_TOUCH_I2C_PORT=0
  -D LGFX_TOUCH_I2C_ADDR=0x38
  -D LGFX_TOUCH_I2C_SDA=16
  -D LGFX_TOUCH_I2C_SCL=15
  -D LGFX_TOUCH_INT=17
  -D LGFX_TOUCH_RST=18
  -D LGFX_TOUCH_X_MIN=0
  -D LGFX_TOUCH_X_MAX=239
  -D LGFX_TOUCH_Y_MIN=0
  -D LGFX_TOUCH_Y_MAX=319
  -D LGFX_TOUCH_ROTATION=2

lib_deps =
  ${esp32s3_base.lib_deps}
  ; device-ui with the board's TX power / duty cycle menu (DEVICEUI_TX_OPTIONS), a clone next to this repo:
  ; git clone -b es3c28p https://github.com/audisN/device-ui ../device-ui
  symlink://../device-ui
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.28

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}

extra_scripts =
  ${esp32s3_base.extra_scripts}
  ${device-ui_base.extra_scripts}
